name: PHPStan
on:
  workflow_call:
    inputs:
      php_version:
        required: false
        type: string
        default: "8.3"
      command:
        description: "The command to run to for phpstan"
        required: false
        type: string
        default: "composer phpstan"
      error_file:
        description: "The path to the error file to capture phpstan JSON errors"
        required: false
        type: string
        default: "phpstan-errors.json"
      artifact_name:
        description: "The name of the phpstan artifact"
        required: false
        type: string
        default: "phpstan-errors"
      cache_path:
        description: "The tmpDir path (i.e. ./.phpstan.cache)"
        required: false
        type: string
        default: "./.phpstan.cache"
      runs_on:
        description: "The OS to run the job on"
        required: false
        type: string
        default: "ubuntu-latest"
      with_valkey_glide:
        description: "Install valkey_glide PHP extension before composer install"
        required: false
        type: boolean
        default: false
    secrets:
      packagist_username:
        required: true
      packagist_password:
        required: true

jobs:
  phpstan:
    runs-on: ${{ inputs.runs_on }}
    name: PHPStan
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: ${{ inputs.php_version }}
          tools: composer

      - name: Install Valkey GLIDE extension
        if: ${{ inputs.with_valkey_glide }}
        uses: ./.github/actions/install-valkey-glide

      - name: Install composer dependencies
        uses: ramsey/composer-install@v2
        env:
          COMPOSER_AUTH: |
            {
              "http-basic": {
                "repo.packagist.com": {
                  "username": "${{ secrets.packagist_username }}",
                  "password": "${{ secrets.packagist_password }}"
                }
              }
            }

      - name: Restore PHPStan Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ inputs.cache_path }}
          key: "${{ runner.os }}-phpstan-${{ github.repository }}-${{ github.run_id }}"
          restore-keys: |
            ${{ runner.os }}-phpstan-${{ github.repository }}-${{ github.ref_name }}
            ${{ runner.os }}-phpstan-${{ github.repository }}-${{ github.event.repository.default_branch }}

      - name: Run PHPStan
        run: ${{ inputs.command }}
        env:
          PHPSTAN_ERROR_FILE: ${{ inputs.error_file }}
      
      - name: Cache PHPStan Results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ inputs.cache_path }}
          key: "${{ runner.os }}-phpstan-${{ github.repository }}-${{ github.run_id }}"

      - name: phpstan errors artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.error_file }}
          include-hidden-files: true
